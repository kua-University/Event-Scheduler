<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EduSchedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="ti ti-calendar-event"></i>
                <div>
                    EduSchedule
                    <span class="auth-sub">Mekelle University</span>
                </div>
            </div>
            <h2>Create account</h2>
            <p class="auth-desc">Join the university scheduling system</p>
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" placeholder="student@mu.edu.et" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign up</button>
            </form>
            <div id="message" class="auth-error"></div>
            <p class="auth-footer">Already have an account? <a href="index.html">Sign in</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
